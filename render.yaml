services:
  - type: web
    name: rodeo-event
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: RESEND_API_KEY
        sync: false
      - key: TO_EMAIL
        value: rodeorent1@gmail.com
      - key: FROM_EMAIL
        value: RODEO EVENT <onboarding@resend.dev>
